<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - Fluenc</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">Fluenc.</div>
        <nav class="main-nav">
            <a href="index.html" class="nav-item">Головна</a>
            <a href="#" class="nav-item">Інфлюенсери</a>
            <a href="#" class="nav-item">Компанії</a>
            <a href="./register.html" class="nav-item signup-btn">Реєстрація</a>
        </nav>
    </header>

    <div class="register-container">
        <div class="register-card">
            <h2>Увійдіть у свій обліковий запис</h2>
            <p>Введіть дані, які ви використовували при реєстрації.</p>

            <div id="errorMessage" class="message-container" style="display: none; background-color: #ffe6e6; border-color: #f44336; color: #8a1712;">
                <i class="fas fa-exclamation-triangle" style="color: #f44336;"></i>
                <div id="errorText"></div>
            </div>

            <form class="registration-form" id="loginForm">
                
                <input type="email" name="mail" placeholder="Електронна пошта (mail)" required>
                <input type="password" name="passwd" placeholder="Пароль (passwd)" required>
                
                <button type="submit" class="cta-button primary large" id="loginBtn">Увійти</button>
                
                <p style="margin-top: 20px; font-size: 14px;">
                    <a href="#" style="color: var(--primary-color);">Забули пароль?</a>
                </p>
                <p style="margin-top: 10px;">
                    Не маєте облікового запису? <a href="./register.html" style="color: var(--primary-color);">Зареєструватися</a>
                </p>
            </form>
        </div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2025 Fluenc. Усі права захищені.</p>
        <div class="footer-links">
            <a href="#">Про нас</a>
            <a href="#">FAQ</a>
            <a href="#">Умови користування</a>
        </div>
    </footer>

    <script>
        // АДРЕСА АПІ для входу
        const API_URL = "http://185.12.143.193:8080/profiles/login/"; 

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Функція для відправки форми через Fetch API
        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault(); 
            
            // Приховуємо попередні помилки
            errorMessage.style.display = 'none'; 

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вхід...';

            // 1. Збір даних
            const formData = new FormData(loginForm);
            const data = {};
            
            for (let pair of formData.entries()) {
                data[pair[0]] = pair[1];
            }

            // 2. Відправка JSON на API
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                // Спроба отримати тіло відповіді, навіть при помилці
                const result = await response.json(); 

                if (response.ok) {
                    // =========================================================
                    // УСПІШНИЙ ВХІД (HTTP 200)
                    // =========================================================
                    
                    // Витягуємо роль користувача з відповіді. result.role є найпростішим
                    const profileData = result.profile_data || result;
                    const userRole = result.role || profileData.type || 'company';
                    
                    // Зберігаємо дані в localStorage 
// Зберігаємо токен
                    localStorage.setItem('userToken', result.token);

// Зберігаємо лише профільні дані
                    localStorage.setItem('userProfile', JSON.stringify(result.profile_data));
              

                    // Перенаправлення залежно від ролі
                    if (userRole === 'influencer') {
                        window.location.href = './profile.html'; 
                    } else if (userRole === 'company') {
                        window.location.href = '/company-dashboard.html'; 
                    } else {
                        window.location.href = '/index.html'; 
                    }

                } else {
                    // =========================================================
                    // ПОМИЛКА ВХОДУ (HTTP 4xx)
                    // =========================================================
                    
                    let message = 'Неправильна пошта або пароль. Спробуйте ще раз.';
                    
                    // Приймаємо повідомлення про помилку від API
                    if (result && result.detail) {
                        message = result.detail;
                    } else if (result && result.message) {
                        message = result.message;
                    }

                    errorText.textContent = message;
                    errorMessage.style.display = 'flex';
                }

            } catch (error) {
                // =========================================================
                // ПОМИЛКА МЕРЕЖІ/СЕРВЕРА
                // =========================================================
                errorText.textContent = 'Помилка з’єднання. Перевірте API-сервер або CORS/HTTPS налаштування.';
                errorMessage.style.display = 'flex';
                console.error('Fetch Error:', error);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Увійти';
            }
        });
    </script>
</body>
</html>

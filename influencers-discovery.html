<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук Інфлюенсерів | Fluenc</title>
    <link rel="stylesheet" href="./styles.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">Fluenc.</div>
        <nav class="main-nav">
            <a href="/flpl/index.html" class="nav-item">Головна</a>
            <a href="./company-discovery.html" class="nav-item">Компанії</a>
            <a href="./profile.html" class="nav-item login-btn">Мій Профіль</a>
            <a href="#" class="nav-item signup-btn" id="logoutBtn">Вийти</a>
        </nav>
    </header>

    <div class="discovery-container">
        
        <div class="discovery-hero">
            <h1>Знайдіть ідеального Інфлюенсера</h1>
            <p>Фільтруйте та сортуйте сотні перевірених профілів, щоб знайти найкращого партнера для вашої кампанії.</p>
        </div>

        <div class="filter-panel">
            <div class="filter-group">
                <label for="category">Категорія</label>
                <select id="category">
                    <option value="">Усі категорії</option>
                    <option value="lifestyle">Lifestyle</option>
                    <option value="tech">Tech</option>
                    <option value="fashion">Fashion</option>
                    <option value="food">Food</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="followers">Підписники (від)</label>
                <select id="followers">
                    <option value="">Будь-яка кількість</option>
                    <option value="10k">10,000+</option>
                    <option value="50k">50,000+</option>
                    <option value="100k">100,000+</option>
                    <option value="1m">1,000,000+</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="country">Країна</label>
                <input type="text" id="country" placeholder="Наприклад, Україна">
            </div>

            <button class="cta-button primary" id="searchButton">
                <i class="fas fa-search"></i> Пошук
            </button>
        </div>

        <div class="results-header">
            <span class="results-count" id="resultsCount">Завантаження...</span>
            <div class="sort-options">
                <label for="sort">Сортувати за:</label>
                <select id="sort">
                    <option value="relevance">Релевантність</option>
                    <option value="followers_desc">Followers (спадання)</option>
                    <option value="price_asc">Ціна (зростання)</option>
                </select>
            </div>
        </div>

        <div class="influencer-grid" id="influencerGrid">
            </div>
        
        <div class="pagination">
            </div>
    </div>

    <footer class="main-footer">
        <p>&copy; 2025 Fluenc. Усі права захищені.</p>
        <div class="footer-links">
            <a href="#">Про нас</a>
            <a href="#">FAQ</a>
            <a href="#">Умови користування</a>
        </div>
    </footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const API_URL = 'http://185.12.143.193:8080/profiles/influencers/';
        const storedToken = localStorage.getItem('userToken'); 
        const influencerGrid = document.getElementById('influencerGrid');
        const resultsCount = document.getElementById('resultsCount');
        const searchButton = document.getElementById('searchButton');
        const LOGIN_PATH = './login.html'; 
        
        const DEFAULT_PHOTO_URL = './defaultava.png'; 

        // 1. ПЕРЕВІРКА АВТОРИЗАЦІЇ
        if (!storedToken) {
            resultsCount.textContent = 'Необхідна авторизація';
            influencerGrid.innerHTML = `
                <div class="error-state" style="text-align: center; padding: 50px;">
                    <h2>Ви не авторизовані</h2>
                    <p>Для перегляду списку інфлюенсерів, будь ласка, <a href="${LOGIN_PATH}" style="color: var(--primary-color);">увійдіть</a> в систему.</p>
                </div>
            `;
            return; 
        }

        // 2. ДОПОМІЖНІ ФУНКЦІЇ
        function formatCount(count) { return 'N/A'; }
        
        function getSocialIcon(socialValue) {
            if (!socialValue) return '<i class="fas fa-globe"></i>';
            const lowerValue = socialValue.toLowerCase();
            if (lowerValue.includes('vk')) return '<i class="fab fa-vk" style="color: #4C75A3;"></i>';
            if (lowerValue.includes('inst') || lowerValue.includes('instagram')) return '<i class="fab fa-instagram" style="color: #E4405F;"></i>';
            return '<i class="fas fa-globe"></i>'; 
        }

        function getCountryCode(countryName) {
            // Дуже спрощена мапа. 
            const countryCodes = {
                'ukraine': 'UA',
                'united states': 'US',
                'usa': 'US',
                'canada': 'CA',
                'deutscland': 'DE',
                'france': 'FR',
                'spain': 'ES',
                'italy': 'IT',
                'poland': 'PL',
                'united kingdom': 'GB',
                'australia': 'AU',
                'japan': 'JP',
                'china': 'CN',
                'india': 'IN',
                'poland': 'PL', 
                 
                // Додайте більше країн за потреби
            };
            // Переводимо назву в нижній регістр для уніфікації
            const lowerCaseCountryName = countryName ? countryName.toLowerCase() : '';
            return countryCodes[lowerCaseCountryName] || null; // Повертаємо код або null
        }
        
        function createInfluencerCard(influencer) {
            const photoUrl = DEFAULT_PHOTO_URL;
            // Перевіряємо, чи існує ID, інакше використовуємо заглушку
            const profileUrl = influencer.id ? `/flpl/influencer-profile.html?id=${influencer.id}` : '#'; 
            const name = influencer.name || `Користувач #${influencer.id || 'N/A'}`;
            const primarySocialIcon = getSocialIcon(influencer.social);
            
            const niche = influencer.category || influencer.niche || 'Не визначено';
            const price = 'Запит';
            const isVerified = ''; 

            // === ВИПРАВЛЕННЯ: Оголошуємо змінні countryName та countryCode тут ===
            const countryName = influencer.Country || ''; 
            const countryCode = getCountryCode(countryName);
            // =======================================================================
            
            // Логіка виправлення URL (для безпечного відкриття зовнішніх посилань)
            let socialLink = influencer.social || '#'; 
            if (socialLink.startsWith('https:/') && !socialLink.startsWith('https://')) {
                socialLink = socialLink.replace('https:/', 'https://');
            } else if (socialLink.startsWith('http:/') && !socialLink.startsWith('http://')) {
                socialLink = socialLink.replace('http:/', 'http://');
            }


            return `
                <div class="influencer-card">
                    <img class="card-photo" src="${photoUrl}" alt="${name}">
                    <div class="card-info">
                        <h3 class="card-name">${name} ${isVerified}</h3>
                        <p class="card-niche">Категорія: ${niche}</p>
                        
                        ${countryCode 
                            ? `<p class="card-country"><img src="https://flagcdn.com/16x12/${countryCode.toLowerCase()}.png" alt="${countryName} flag" class="flag-icon" /> ${countryName}</p>` 
                            : `<p class="card-country"><i class="fas fa-map-marker-alt"></i> ${countryName || 'Країна не вказана'}</p>`
                        }
                        
                        <div class="card-stats" style="grid-template-columns: 1fr; border-top: none;">
                            <a href="${socialLink}" target="_blank" class="stat-item" 
                               style="flex-direction: row; gap: 10px; margin-bottom: 5px; text-decoration: none; color: inherit;">
                                ${primarySocialIcon || 'Соціальна мережа не вказана'}
                            </a>
                        </div>

                        <div class="card-pricing">
                            <strong>Ціна поста:</strong> ${price}
                        </div>
                    </div>    
                    <a href="${profileUrl}" class="cta-button secondary full-width-btn">Переглянути Профіль</a>
                </div>
            `;
        }

        // 3. ФУНКЦІЯ ЗАВАНТАЖЕННЯ ДАНИХ (Виправлено парсинг)
        async function fetchInfluencers() {
            influencerGrid.innerHTML = '<h2>Завантаження даних...</h2>';
            resultsCount.textContent = 'Завантаження...';

            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Token ${storedToken}`, 
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('userToken');
                        alert('Ваша сесія закінчилася або токен недійсний. Будь ласка, увійдіть знову.');
                        window.location.href = LOGIN_PATH;
                        return;
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // === ВИПРАВЛЕННЯ ПАРСИНГУ: ЗНАЙШЛИ МАСИВ У ВЛАСТИВОСТІ 'influencers' ===
                let influencers;
                if (data && Array.isArray(data.influencers)) {
                    influencers = data.influencers; 
                } else if (Array.isArray(data)) {
                    influencers = data; // Запасний варіант для прямого масиву
                } else {
                    // Якщо не вдалося знайти масив, залишаємо його порожнім
                    influencers = [];
                }
                // =======================================================================


                if (influencers.length === 0) {
                    influencerGrid.innerHTML = '<p class="no-results" style="text-align: center;">На жаль, інфлюенсерів не знайдено.</p>';
                    resultsCount.textContent = 'Знайдено 0 інфлюенсерів';
                    return;
                }

                // Рендеринг карток
                const cardsHtml = influencers.map(createInfluencerCard).join('');
                influencerGrid.innerHTML = cardsHtml;
                resultsCount.textContent = `Знайдено ${influencers.length} інфлюенсерів`;

            } catch (error) {
                console.error('Помилка завантаження інфлюенсерів:', error);
                influencerGrid.innerHTML = `
                    <div class="error-state" style="text-align: center; padding: 30px;">
                        <h2>Помилка завантаження даних</h2>
                        <p>Не вдалося отримати дані з API. Перевірте мережу або API-сервер.</p>
                    </div>
                `;
                resultsCount.textContent = 'Помилка завантаження';
            }
        }

        // Запускаємо завантаження даних
        fetchInfluencers();
        
        // Додаємо обробник подій для кнопки "Пошук"
        searchButton.addEventListener('click', fetchInfluencers);
    });
</script>
</body>
</html>
